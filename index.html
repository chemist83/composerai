        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);

        .chat-header {

            color: white;

            text-align: center;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f7fafc;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-in;
        }

        .user {
            background: #4299e1;
            color: white;
            margin-left: auto;
        }

        .ai {
            background: #48bb78;
            color: white;
        }

        .system {
            background: #ed8936;
            color: white;
            text-align: center;
            max-width: 100%;
        }

        .chat-input {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .chat-input input:focus {
            border-color: #4299e1;
        }

        .chat-input button {
            margin-left: 10px;
            padding: 12px 20px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .chat-input button:hover {
            background: #3182ce;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .clear-btn {
            background: #e53e3e !important;
            margin-left: 5px;
            padding: 12px 15px !important;
        }

        .clear-btn:hover {
            background: #c53030 !important;
        }
    </style>
</head>

        // Chat functionality with message persistence and conversation memory
        let chatMessages = [];
        let conversationMemory = {}; // Stores information learned during conversation
        let conversationContext = null; // Stores current topic context for follow-up questions

        // Load saved messages on startup
        function loadMessages() {
            const saved = localStorage.getItem('aiChatMessages');
            if (saved) {
                chatMessages = JSON.parse(saved);
                chatMessages.forEach(msg => displayMessage(msg.type, msg.content, false));
            }
            
            // Load conversation memory and context
            const savedMemory = localStorage.getItem('aiConversationMemory');
            if (savedMemory) {
                conversationMemory = JSON.parse(savedMemory);
            }
            
            const savedContext = localStorage.getItem('aiConversationContext');
            if (savedContext) {
                conversationContext = JSON.parse(savedContext);
            }
        }

        // Save messages, memory, and context to localStorage
        function saveMessages() {
            localStorage.setItem('aiChatMessages', JSON.stringify(chatMessages));
            localStorage.setItem('aiConversationMemory', JSON.stringify(conversationMemory));
            localStorage.setItem('aiConversationContext', JSON.stringify(conversationContext));
        }

        // Learn information from user messages
        function learnFromMessage(message) {
            const messageLower = message.toLowerCase();
            
            // Detect patterns like "My name is...", "I am...", "I like...", etc.
            const patterns = [
                { regex: /my name is (\w+)/i, key: 'name', template: 'Your name is {value}' },
                { regex: /i am (\w+)/i, key: 'identity', template: 'You are {value}' },
                { regex: /i like (.+)/i, key: 'likes', template: 'You like {value}' },
                { regex: /i love (.+)/i, key: 'loves', template: 'You love {value}' },
                { regex: /i hate (.+)/i, key: 'hates', template: 'You hate {value}' },
                { regex: /i work at (.+)/i, key: 'work', template: 'You work at {value}' },
                { regex: /i live in (.+)/i, key: 'location', template: 'You live in {value}' },
                { regex: /i am from (.+)/i, key: 'origin', template: 'You are from {value}' },
                { regex: /i study (.+)/i, key: 'studies', template: 'You study {value}' },
                { regex: /i have (.+)/i, key: 'possessions', template: 'You have {value}' },
                { regex: /i want (.+)/i, key: 'wants', template: 'You want {value}' },
                { regex: /i need (.+)/i, key: 'needs', template: 'You need {value}' },
                { regex: /i prefer (.+)/i, key: 'preferences', template: 'You prefer {value}' },
                { regex: /i enjoy (.+)/i, key: 'enjoys', template: 'You enjoy {value}' },
                { regex: /i play (.+)/i, key: 'plays', template: 'You play {value}' },
                { regex: /i watch (.+)/i, key: 'watches', template: 'You watch {value}' },
                { regex: /i read (.+)/i, key: 'reads', template: 'You read {value}' },
                { regex: /i listen to (.+)/i, key: 'listens', template: 'You listen to {value}' },
                { regex: /i drive (.+)/i, key: 'drives', template: 'You drive {value}' },
                { regex: /i own (.+)/i, key: 'owns', template: 'You own {value}' },
                { regex: /i visited (.+)/i, key: 'visited', template: 'You visited {value}' },
                { regex: /i went to (.+)/i, key: 'went', template: 'You went to {value}' },
                { regex: /i graduated from (.+)/i, key: 'education', template: 'You graduated from {value}' },
                { regex: /i speak (.+)/i, key: 'languages', template: 'You speak {value}' },
                { regex: /i can (.+)/i, key: 'abilities', template: 'You can {value}' },
                { regex: /i cannot (.+)/i, key: 'limitations', template: 'You cannot {value}' },
                { regex: /i feel (.+)/i, key: 'feelings', template: 'You feel {value}' },
                { regex: /i think (.+)/i, key: 'thoughts', template: 'You think {value}' },
                { regex: /i believe (.+)/i, key: 'beliefs', template: 'You believe {value}' }
            ];

            let learned = false;
            for (let pattern of patterns) {
                const match = message.match(pattern.regex);
                if (match) {
                    const value = match[1].trim();
                    if (!conversationMemory[pattern.key]) {
                        conversationMemory[pattern.key] = [];
                    }
                    
                    // Avoid duplicates
                    if (!conversationMemory[pattern.key].includes(value)) {
                        conversationMemory[pattern.key].push(value);
                        learned = true;
                    }
                }
            }

            return learned;
        }

        // Check if question is about the user based on conversation memory
        function checkUserQuestion(question) {
            const questionLower = question.toLowerCase();
            
            // Questions about user's information
            const userQuestions = [
                { patterns: ['what is my name', 'my name', 'who am i'], key: 'name', template: 'Your name is {value}.' },
                { patterns: ['what do i like', 'what i like', 'my likes'], key: 'likes', template: 'You like {value}.' },
                { patterns: ['what do i love', 'what i love'], key: 'loves', template: 'You love {value}.' },
                { patterns: ['what do i hate', 'what i hate'], key: 'hates', template: 'You hate {value}.' },
                { patterns: ['where do i work', 'my work', 'my job'], key: 'work', template: 'You work at {value}.' },
                { patterns: ['where do i live', 'my location', 'where am i from'], key: 'location', template: 'You live in {value}.' },
                { patterns: ['where am i from', 'my origin'], key: 'origin', template: 'You are from {value}.' },
                { patterns: ['what do i study', 'my studies'], key: 'studies', template: 'You study {value}.' },
                { patterns: ['what do i have', 'my possessions'], key: 'possessions', template: 'You have {value}.' },
                { patterns: ['what do i want', 'my wants'], key: 'wants', template: 'You want {value}.' },
                { patterns: ['what do i need', 'my needs'], key: 'needs', template: 'You need {value}.' },
                { patterns: ['what do i prefer', 'my preferences'], key: 'preferences', template: 'You prefer {value}.' },
                { patterns: ['what do i enjoy', 'my hobbies'], key: 'enjoys', template: 'You enjoy {value}.' },
                { patterns: ['what do i play', 'what games'], key: 'plays', template: 'You play {value}.' },
                { patterns: ['what do i watch', 'what shows'], key: 'watches', template: 'You watch {value}.' },
                { patterns: ['what do i read', 'what books'], key: 'reads', template: 'You read {value}.' },
                { patterns: ['what do i listen', 'what music'], key: 'listens', template: 'You listen to {value}.' },
                { patterns: ['what do i drive', 'my car'], key: 'drives', template: 'You drive {value}.' },
                { patterns: ['what do i own', 'my belongings'], key: 'owns', template: 'You own {value}.' },
                { patterns: ['where did i visit', 'where have i been'], key: 'visited', template: 'You visited {value}.' },
                { patterns: ['where did i go', 'where i went'], key: 'went', template: 'You went to {value}.' },
                { patterns: ['where did i graduate', 'my education'], key: 'education', template: 'You graduated from {value}.' },
                { patterns: ['what languages', 'what do i speak'], key: 'languages', template: 'You speak {value}.' },
                { patterns: ['what can i do', 'my abilities'], key: 'abilities', template: 'You can {value}.' },
                { patterns: ['what cannot i do', 'my limitations'], key: 'limitations', template: 'You cannot {value}.' }
            ];

            for (let userQ of userQuestions) {
                for (let pattern of userQ.patterns) {
                    if (questionLower.includes(pattern)) {
                        if (conversationMemory[userQ.key] && conversationMemory[userQ.key].length > 0) {
                            const values = conversationMemory[userQ.key].join(', ');
                            return userQ.template.replace('{value}', values);
                        } else {
                            return `I don't know that about you yet. You can tell me by saying something like "I ${userQ.key === 'name' ? 'am' : userQ.key.slice(0, -1)} ..."`;
                        }
                    }
                }
            }

            return null;
        }

        // Initialize chat
        function initChat() {
            loadMessages();
            
            // Only add welcome messages if no previous messages
            if (chatMessages.length === 0) {
                addMessage('system', '🤖 Hello! I have 1000+ topics, conversational memory, AND internet search!');
                addMessage('system', `📚 I use strict matching - no more false answers from single letters!`);
                addMessage('ai', 'Ask me anything - if I don\'t know it, I\'ll search the web! 🌐');
                addMessage('system', '💡 Try: "What is Bitcoin?" or "/test p" to see improved matching!');
            }
        }

        // Add message to chat
        function addMessage(type, content, save = true) {
            displayMessage(type, content, true);
            
            if (save) {
                chatMessages.push({ type, content, timestamp: Date.now() });
                saveMessages();
            }
        }

        // Display message in chat
        function displayMessage(type, content, animate = false) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = content;
            
            if (animate) {
                messageDiv.style.opacity = '0';
                messageDiv.style.transform = 'translateY(10px)';
            }
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            if (animate) {
                setTimeout(() => {
                    messageDiv.style.opacity = '1';
                    messageDiv.style.transform = 'translateY(0)';
                }, 50);
            }
        }

        // Send message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage('user', message);
            input.value = '';
            
            // Handle debug commands
            if (message.toLowerCase().startsWith('/test ')) {
                const testQuery = message.substring(6);
                setTimeout(() => {
                    const answer = findAnswer(testQuery);
                    if (answer) {
                        addMessage('system', `🧪 Test Result: FOUND match for "${testQuery}"`);
                        addMessage('ai', answer);
                    } else {
                        addMessage('system', `🧪 Test Result: NO match found for "${testQuery}" - will search internet`);
                        searchInternet(testQuery);
                    }
                }, 300);
                return;
            }
            
            // Learn from user message
            const learned = learnFromMessage(message);
            if (learned) {
                setTimeout(() => {
                    addMessage('ai', "Got it! I'll remember that about you. 😊");
                }, 300);
                return;
            }
            
            // Find answer
            setTimeout(() => {
                // First check if it's a question about the user
                const userAnswer = checkUserQuestion(message);
                if (userAnswer) {
                    addMessage('ai', userAnswer);
                    return;
                }
                
                // Check if it's a follow-up question about current context
                const contextualAnswer = checkContextualQuestion(message);
                if (contextualAnswer) {
                    return; // contextualAnswer handles the response internally
                }
                
                // Then check knowledge base
                const answer = findAnswer(message);
                if (answer) {
                    addMessage('ai', answer);
                    // Set context for potential follow-up questions
                    setConversationContext(message, answer);
                } else {
                    // Search the internet for new information
                    addMessage('ai', '🔍 I don\'t have that information in my knowledge base. Let me search the internet for you...');
                    searchInternetWithContext(message);
                }
            }, 500);
        }

        // Set context from internet search results
        function setConversationContextFromSearch(query, result) {
            // Extract subject from query
            const queryLower = query.toLowerCase();
            let subject = null;
            
            const patterns = [
                /who is (.+?)[\?]?$/i,
                /what is (.+?)[\?]?$/i,
                /tell me about (.+?)[\?]?$/i,
                /(.+?) (?:was|is|did|does)/i
            ];
            
            for (let pattern of patterns) {
                const match = query.match(pattern);
                if (match) {
                    subject = match[1].trim();
                    break;
                }
            }
            
            if (subject && subject.length > 2) {
                conversationContext = {
                    subject: subject,
                    originalQuestion: query,
                    lastAnswer: result,
                    timestamp: Date.now(),
                    searchQueries: [subject, query]
                };
                saveMessages();
            }
        }

        // Check if current question is about the previous context
        function checkContextualQuestion(question) {
            if (!conversationContext) return null;
            
            const questionLower = question.toLowerCase();
            
            // Check if question is contextual (doesn't contain the subject name)
            const containsSubject = questionLower.includes(conversationContext.subject.toLowerCase());
            
            // Contextual question patterns
            const contextualPatterns = [
                'was he', 'was she', 'is he', 'is she', 'did he', 'did she',
                'his', 'her', 'him', 'them', 'they', 'their',
                'when did', 'where did', 'how did', 'why did',
                'what did', 'who did', 'which',
                'more about', 'tell me more', 'what else',
                'also', 'additionally', 'furthermore',
                'was it', 'is it', 'did it', 'does it',
                'good', 'bad', 'evil', 'nice', 'terrible',
                'famous', 'known for', 'remembered',
                'born', 'died', 'lived', 'age',
                'achievements', 'accomplishments', 'works',
                'character', 'personality', 'traits',
                'impact', 'influence', 'legacy',
                'controversial', 'opinion', 'view'
            ];
            
            const isContextual = contextualPatterns.some(pattern => questionLower.includes(pattern));
            
            if (isContextual && !containsSubject) {
                // This is likely a follow-up question about the current context
                const contextualQuery = `${conversationContext.subject} ${question}`;
                addMessage('system', `🔗 I understand you're asking about ${conversationContext.subject}. Let me search for more specific information...`);
                searchInternetWithContext(contextualQuery);
                return true; // Handled contextually
            }
            
            // If it's been more than 10 minutes, clear context
            if (Date.now() - conversationContext.timestamp > 600000) {
                conversationContext = null;
                saveMessages();
            }
            
            return null;
        }

                if (successfulResults.length > 0) {

                    addMessage('ai', `🌐 **Internet Search Result:**\n\n${bestResult}`);
                    
                    // Update or set context

                        if (!conversationContext.searchQueries.includes(query)) {

        // Ultra-strict search function - no more false matches
        function findAnswer(question) {
            const queryLower = question.toLowerCase().trim();
            
            // Ignore very short queries (less than 3 characters)
            if (queryLower.length < 3) {
                return null;
            }
            
            let bestMatch = null;
            let bestScore = 0;

            for (let item of knowledgeBase) {
                let score = 0;
                const itemQuestionLower = item.question.toLowerCase();

                // Exact question match (highest priority)
                if (itemQuestionLower === queryLower) {
                    return item.answer;
                }

                // Very strict similarity check
                const similarity = calculateSimilarity(queryLower, itemQuestionLower);
                
                // Only consider high similarity matches
                if (similarity > 0.85) {
                    score += 300;
                } else if (similarity > 0.75) {
                    score += 200;
                } else if (similarity > 0.65) {
                    score += 100;
                } else {
                    // Skip if similarity is too low
                    continue;
                }

                // Additional checks for partial matches
                const queryWords = queryLower.split(' ').filter(word => word.length > 2);
                const questionWords = itemQuestionLower.split(' ').filter(word => word.length > 2);
                
                // Count exact word matches
                let exactWordMatches = 0;
                let totalQueryWords = queryWords.length;
                
                for (let qWord of queryWords) {
                    if (questionWords.includes(qWord)) {
                        exactWordMatches++;
                    }
                }
                
                // Require at least 60% of query words to match for shorter queries
                // Require at least 40% for longer queries
                const requiredMatchPercentage = totalQueryWords <= 3 ? 0.6 : 0.4;
                const matchPercentage = exactWordMatches / totalQueryWords;
                
                if (matchPercentage < requiredMatchPercentage) {
                    continue; // Skip this item
                }
                
                // Bonus for word matches
                score += exactWordMatches * 50;
                
                // Check for meaningful keyword matches (not single letters)
                let meaningfulKeywordMatches = 0;
                for (let keyword of item.keywords) {
                    if (keyword.length > 2 && queryLower.includes(keyword.toLowerCase())) {
                        // Make sure it's a whole word match, not partial
                        const regex = new RegExp('\\b' + keyword.toLowerCase() + '\\b');
                        if (regex.test(queryLower)) {
                            meaningfulKeywordMatches++;
                            score += 40;
                        }
                    }
                }

                // Additional validation: prevent single character matches
                if (queryLower.length === 1 || (queryLower.length < 4 && exactWordMatches === 0)) {
                    continue;
                }

                // Prevent partial word contamination (like "p" matching "python")
                if (queryLower.length < 4) {
                    let hasExactMatch = false;
                    for (let word of questionWords) {
                        if (word === queryLower) {
                            hasExactMatch = true;
                            break;
                        }
                    }
                    if (!hasExactMatch) {
                        continue;
                    }
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestMatch = item;
                }
            }

            // Very high threshold - only return if we're very confident
            return bestScore > 150 ? bestMatch.answer : null;
        }

        // Calculate similarity between two strings
        function calculateSimilarity(str1, str2) {
            const longer = str1.length > str2.length ? str1 : str2;
            const shorter = str1.length > str2.length ? str2 : str1;
            
            if (longer.length === 0) return 1.0;
            
            const editDistance = levenshteinDistance(longer, shorter);
            return (longer.length - editDistance) / longer.length;
        }

        // Calculate Levenshtein distance
        function levenshteinDistance(str1, str2) {
            const matrix = [];
            
            for (let i = 0; i <= str2.length; i++) {
                matrix[i] = [i];
            }
            
            for (let j = 0; j <= str1.length; j++) {
                matrix[0][j] = j;
            }
            
            for (let i = 1; i <= str2.length; i++) {
                for (let j = 1; j <= str1.length; j++) {
                    if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            
            return matrix[str2.length][str1.length];
        }

        // Search Wikipedia API with better error handling and multiple attempts
        async function searchWithWikipedia(query) {
            try {
                // Clean up the query for better results
                const cleanQuery = query.replace(/^(what is|who is|tell me about|explain)\s+/i, '').trim();
                
                // First try: Direct page lookup
                let searchUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanQuery)}`;
                let response = await fetch(searchUrl);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.extract && data.extract.length > 50 && !data.extract.includes('may refer to')) {
                        let result = data.extract;
                        // Add page title if it's different from query
                        if (data.title && data.title.toLowerCase() !== cleanQuery.toLowerCase()) {
                            result = `**${data.title}**: ${result}`;
                        }
                        return `${result}\n\n📖 Source: Wikipedia`;
                    }
                }
                
                // Second try: Search for pages
                const searchApiUrl = `https://en.wikipedia.org/w/api.php?action=query&format=json&list=search&srsearch=${encodeURIComponent(cleanQuery)}&srlimit=3&origin=*`;
                const searchResponse = await fetch(searchApiUrl);
                
                if (searchResponse.ok) {
                    const searchData = await searchResponse.json();
                    if (searchData.query && searchData.query.search && searchData.query.search.length > 0) {
                        // Try the top 3 search results
                        for (let i = 0; i < Math.min(3, searchData.query.search.length); i++) {
                            const result = searchData.query.search[i];
                            try {
                                const pageUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(result.title)}`;
                                const pageResponse = await fetch(pageUrl);
                                
                                if (pageResponse.ok) {
                                    const pageData = await pageResponse.json();
                                    if (pageData.extract && pageData.extract.length > 100 && !pageData.extract.includes('may refer to')) {
                                        return `**${pageData.title}**: ${pageData.extract}\n\n📖 Source: Wikipedia`;
                                    }
                                }
                            } catch (pageError) {
                                console.log(`Failed to fetch page ${result.title}:`, pageError);
                                continue;
                            }
                        }
                    }
                }
                
                // Third try: OpenSearch API for suggestions
                const opensearchUrl = `https://en.wikipedia.org/w/api.php?action=opensearch&format=json&search=${encodeURIComponent(cleanQuery)}&limit=3&origin=*`;
                const opensearchResponse = await fetch(opensearchUrl);
                
                if (opensearchResponse.ok) {
                    const opensearchData = await opensearchResponse.json();
                    if (opensearchData && opensearchData.length > 1 && opensearchData[1].length > 0) {
                        const suggestedTitle = opensearchData[1][0];
                        const pageUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(suggestedTitle)}`;
                        const pageResponse = await fetch(pageUrl);
                        
                        if (pageResponse.ok) {
                            const pageData = await pageResponse.json();
                            if (pageData.extract && pageData.extract.length > 50) {
                                return `**${pageData.title}**: ${pageData.extract}\n\n📖 Source: Wikipedia`;
                            }
                        }
                    }
                }
                
            } catch (error) {
                console.error('Wikipedia search error:', error);
            }
            return null;
        }

        // Search with DuckDuckGo Instant Answer API
        async function searchWithDuckDuckGo(query) {
            try {
                const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
                const response = await fetch(url);
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // Check for instant answer
                    if (data.AbstractText && data.AbstractText.length > 50) {
                        return `${data.AbstractText} (Source: ${data.AbstractSource || 'DuckDuckGo'})`;
                    }
                    
                    // Check for definition
                    if (data.Definition && data.Definition.length > 20) {
                        return `${data.Definition} (Source: ${data.DefinitionSource || 'DuckDuckGo'})`;
                    }
                    
                    // Check for answer
                    if (data.Answer && data.Answer.length > 10) {
                        return `${data.Answer} (Source: DuckDuckGo)`;
                    }
                }
            } catch (error) {
                console.error('DuckDuckGo search error:', error);
            }
            return null;
        }

        // Search country information
        async function searchCountryInfo(query) {
            try {
                // Extract country name from query
                const countries = ['afghanistan', 'albania', 'algeria', 'argentina', 'australia', 'austria', 'bangladesh', 'belgium', 'brazil', 'canada', 'china', 'colombia', 'denmark', 'egypt', 'finland', 'france', 'germany', 'greece', 'india', 'indonesia', 'iran', 'iraq', 'ireland', 'israel', 'italy', 'japan', 'jordan', 'kenya', 'korea', 'malaysia', 'mexico', 'netherlands', 'nigeria', 'norway', 'pakistan', 'philippines', 'poland', 'portugal', 'russia', 'saudi arabia', 'singapore', 'south africa', 'spain', 'sweden', 'switzerland', 'thailand', 'turkey', 'ukraine', 'united kingdom', 'uk', 'united states', 'usa', 'vietnam'];
                
                const queryLower = query.toLowerCase();
                const foundCountry = countries.find(country => queryLower.includes(country));
                
                if (foundCountry) {
                    const url = `https://restcountries.com/v3.1/name/${encodeURIComponent(foundCountry)}`;
                    const response = await fetch(url);
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.length > 0) {
                            const country = data[0];
                            let info = `${country.name.common} is a country`;
                            
                            if (country.capital && country.capital.length > 0) {
                                info += ` with capital ${country.capital[0]}`;
                            }
                            
                            if (country.population) {
                                info += `, population of ${country.population.toLocaleString()}`;
                            }
                            
                            if (country.region) {
                                info += `, located in ${country.region}`;
                            }
                            
                            if (country.currencies) {
                                const currency = Object.values(country.currencies)[0];
                                if (currency) {
                                    info += `, currency is ${currency.name}`;
                                }
                            }
                            
                            return `${info}. (Source: REST Countries API)`;
                        }
                    }
                }
            } catch (error) {
                console.error('Country search error:', error);
            }
            return null;
        }

        // Enhanced general knowledge patterns for common questions
        function searchGeneralKnowledge(query) {
            const queryLower = query.toLowerCase();
            
            // Current date/time questions
            if (queryLower.includes('what time') || queryLower.includes('current time')) {
                return `🕐 The current time is ${new Date().toLocaleTimeString()}.\n\n⏰ Source: Your device`;
            }
            
            if (queryLower.includes('what date') || queryLower.includes('today') || queryLower.includes('current date')) {
                const today = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                return `📅 Today is ${today.toLocaleDateString('en-US', options)}.\n\n📆 Source: Your device`;
            }
            
            if (queryLower.includes('what year') || queryLower.includes('current year')) {
                return `📅 The current year is ${new Date().getFullYear()}.\n\n🗓️ Source: Your device`;
            }
            
            // Enhanced math calculations
            if (queryLower.includes('calculate') || queryLower.includes('math') || /\d+\s*[\+\-\*\/]\s*\d+/.test(queryLower)) {
                try {
                    // More comprehensive math patterns
                    const mathPatterns = [
                        /(\d+(?:\.\d+)?)\s*([\+\-\*\/])\s*(\d+(?:\.\d+)?)/,
                        /what\s+is\s+(\d+(?:\.\d+)?)\s*([\+\-\*\/])\s*(\d+(?:\.\d+)?)/,
                        /calculate\s+(\d+(?:\.\d+)?)\s*([\+\-\*\/])\s*(\d+(?:\.\d+)?)/
                    ];
                    
                    for (let pattern of mathPatterns) {
                        const mathMatch = queryLower.match(pattern);
                        if (mathMatch) {
                            const num1 = parseFloat(mathMatch[1]);
                            const operator = mathMatch[2];
                            const num2 = parseFloat(mathMatch[3]);
                            
                            let result;
                            let operatorName;
                            switch (operator) {
                                case '+': 
                                    result = num1 + num2; 
                                    operatorName = 'plus';
                                    break;
                                case '-': 
                                    result = num1 - num2; 
                                    operatorName = 'minus';
                                    break;
                                case '*': 
                                    result = num1 * num2; 
                                    operatorName = 'times';
                                    break;
                                case '/': 
                                    if (num2 !== 0) {
                                        result = num1 / num2;
                                        operatorName = 'divided by';
                                    } else {
                                        return `🚫 Cannot divide by zero!\n\n🧮 Source: Built-in calculator`;
                                    }
                                    break;
                            }
                            
                            return `🧮 **Calculation Result:**\n\n${num1} ${operatorName} ${num2} = **${result}**\n\n📊 Source: Built-in calculator`;
                        }
                    }
                } catch (error) {
                    console.error('Math calculation error:', error);
                }
            }
            
            // Weather guidance
            if (queryLower.includes('weather') || queryLower.includes('temperature')) {
                return `🌤️ **Weather Information:**\n\nI can't access real-time weather data, but here are reliable sources:\n\n• Weather.com or Weather apps\n• Google: "weather [your city]"\n• Local news websites\n• Weather.gov (for US locations)\n\n🌍 Source: General guidance`;
            }
            
            // News guidance  
            if (queryLower.includes('news') || queryLower.includes('latest') || queryLower.includes('current events')) {
                return `📰 **Latest News Sources:**\n\nFor current events and news, check these reliable sources:\n\n• BBC News, Reuters, AP News\n• Your local news websites\n• Google News for aggregated stories\n• NPR for in-depth coverage\n\n📺 Source: General guidance`;
            }
            
            // Stock/financial guidance
            if (queryLower.includes('stock') || queryLower.includes('price') || queryLower.includes('market')) {
                return `📈 **Financial Information:**\n\nFor current market data and stock prices:\n\n• Yahoo Finance\n• Google Finance\n• Bloomberg\n• MarketWatch\n• Your broker's app\n\n💰 Source: General guidance`;
            }
            
            // Technology help
            if (queryLower.includes('how to') && (queryLower.includes('computer') || queryLower.includes('phone') || queryLower.includes('app'))) {
                return `💻 **Tech Help:**\n\nFor technical support and how-to guides:\n\n• Official support websites\n• YouTube tutorials\n• Stack Overflow for programming\n• Reddit communities\n• User manuals and documentation\n\n🔧 Source: General guidance`;
            }
            
            return null;
        }
